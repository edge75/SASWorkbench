# Builds and tests on both platforms from the first milestone, so portability never rots.
# Nothing here needs the gaming platform or the machine library: the protocol catalogue is
# generated once and committed, and the tests run against the software machine peer.
#
# Packaging and publishing are not done here — that is `release.yml`. This workflow's job is to
# decide whether the code works, on both platforms natively.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SasWorkbench.slnx

      - name: Build
        run: dotnet build SasWorkbench.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test SasWorkbench.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory artifacts/test-results

      # The suite must pass over a link that carries all nine bits, on both platforms. On Linux
      # the serial backend refuses to open rather than dropping the wakeup bit, and a test asserts
      # that refusal, so this run also proves the refusal happens.
      - name: Run the regression scripts through the command line
        run: >
          dotnet run --project src/SasWorkbench.Cli --configuration Release --no-build --
          run tests/regression --loopback --stimulus software
          --report html,junit,md,jsonl --out artifacts/run

      # The conformance tree now has cases that run, so this expects a pass; the exit code for a
      # suite in which nothing could be tested is proved by a unit test instead. The cases
      # labelled a finding are left out: one of them fails on purpose, and the step below keeps
      # that honest.
      - name: Check that the conformance tree passes with the findings left out
        shell: bash
        run: |
          set +e
          dotnet run --project src/SasWorkbench.Cli --configuration Release --no-build -- \
            run tests/conformance --loopback --stimulus software --skip-tag finding
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "the conformance tree did not pass with the findings left out (exit $code)"
            exit 1
          fi

      # A case labelled a finding is expected to fail, because what it is about is a machine that
      # does not do what a conformance document asks. Checking that it still fails is what stops
      # the label outliving the finding: the day the machine library changes, this goes red and
      # somebody takes the label off.
      - name: Check that the findings are still findings
        shell: bash
        run: |
          set +e
          dotnet run --project src/SasWorkbench.Cli --configuration Release --no-build -- \
            run tests/conformance --loopback --stimulus software --tag finding
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "a case labelled a finding no longer fails (exit $code). If the machine library"
            echo "now does what the document asks, take the label off and delete this step."
            exit 1
          fi

      - name: What this environment could do
        run: dotnet run --project src/SasWorkbench.Cli --configuration Release --no-build -- probe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: artifacts
          if-no-files-found: warn
